name: Build and release WslDock
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: dotnet run --project tests/SingleInstance/SingleInstance.Tests.csproj -c Release
      - run: dotnet run --project tests/WslRequests/WslRequests.Tests.csproj -c Release
      - name: Package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/WslDock/WslDock.csproj)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version differ' }
          ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WslDock-win-x64
          path: artifacts/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WslDock-win-x64
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its published assets.'
          else
            gh release create "$TAG" release/* --verify-tag --title "WslDock $TAG" --notes-file CHANGELOG.md
          fi
